<!DOCTYPE html>
<html lang="ru">
<head>
<!-- DEPLOY-MARKER: 2026-08-06-v2 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JOCK NUTRITION</title>
    <link rel="stylesheet" href="styles.css?v=16">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#34C759">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="JOCK">
    <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
    <meta name="apple-mobile-web-app-title" content="JOCK NUTRITION">
</head>
<body>
    <script>
        (function() {
            const hash = window.location.hash;
            if (hash.includes('access_token=') || hash.includes('type=recovery')) {
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                const refreshToken = params.get('refresh_token');
                const type = params.get('type');
                if (accessToken || type === 'recovery') {
                    if (accessToken) {
                        localStorage.setItem('admin-token', accessToken);
                    }
                    if (refreshToken) {
                        localStorage.setItem('admin-refresh-token', refreshToken);
                    }
                    window.location.href = 'https://jabraiil.github.io/JOCK-NUTRITION/admin/';
                }
            }
        })();
    </script>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">JACK NUTRITION</a>
                <div class="header-actions">
                    <button id="searchToggle" class="icon-btn" aria-label="Поиск">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                    <button id="barcodeToggle" class="icon-btn" aria-label="Сканировать штрих-код" title="Сканировать штрих-код">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <path d="M3 5v14"></path>
                            <path d="M7 5v14"></path>
                            <path d="M11 5v14"></path>
                            <path d="M15 5v14"></path>
                            <path d="M19 5v14"></path>
                            <path d="M21 5v14"></path>
                        </svg>
                    </button>
                    <button id="filterToggle" class="icon-btn" aria-label="Фильтры">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path>
                        </svg>
                    </button>
                    <button id="cartBtn" class="cart-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <span id="cartCount" class="cart-count">0</span>
                    </button>
                    <button id="favoritesToggle" class="icon-btn" aria-label="Избранное">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span id="favoritesCount" class="cart-count">0</span>
                    </button>
                    <button id="themeToggle" class="icon-btn" aria-label="Тема">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div id="searchBar" class="search-bar hidden">
                <input type="text" id="searchInput" placeholder="Поиск по названию и бренду...">
                <button id="searchClear" class="icon-btn">&times;</button>
            </div>

            <div id="barcodeScanner" class="barcode-scanner hidden">
                <button id="closeScannerX" class="scanner-close" aria-label="Закрыть сканер">&times;</button>
                <video id="scannerVideo" playsinline muted autoplay></video>
                <div class="scanner-overlay">
                    <div class="scanner-frame"></div>
                </div>
                <div class="scanner-tools">
                    <button id="scannerModeToggle" class="scanner-mode-toggle" aria-label="Ручной ввод" title="Ручной ввод">⌨️</button>
                    <button id="flashToggle" class="scanner-flash" aria-label="Вспышка" title="Вспышка">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
                            <path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"></path>
                        </svg>
                    </button>
                    <button id="zoomToggle" class="scanner-zoom" aria-label="Зум" title="Зум">1×</button>
                </div>
                <div id="scannerManual" class="scanner-manual hidden">
                    <input type="text" id="manualBarcodeInput" placeholder="Введите штрих-код..." autocomplete="off">
                    <button id="manualBarcodeSubmit" class="scanner-manual-btn">Найти</button>
                </div>
            </div>

            <div id="filterSidebarOverlay" class="sidebar-overlay"></div>
            <aside id="filterSidebar" class="sidebar-drawer">
                <div class="sidebar-drawer-header">
                    <h2>Фильтры</h2>
                    <button id="filterSidebarClose" class="sidebar-drawer-close">&times;</button>
                </div>
                <div class="filters">
                    <div class="filter-group">
                        <label>Категория</label>
                        <select id="categoryFilter">
                            <option value="">Все</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Бренд</label>
                        <select id="brandFilter">
                            <option value="">Все</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Цена от</label>
                        <input type="number" id="priceFrom" placeholder="0">
                    </div>
                    <div class="filter-group">
                        <label>Цена до</label>
                        <input type="number" id="priceTo" placeholder="∞">
                    </div>
                    <div class="filter-group">
                        <label>Сортировка</label>
                        <select id="sortFilter">
                            <option value="newest">По новизне</option>
                            <option value="price-asc">Цена по возр.</option>
                            <option value="price-desc">Цена по убыв.</option>
                            <option value="name">По названию</option>
                        </select>
                    </div>
                </div>
                <div class="filter-actions">
                    <button id="resetFilters" class="btn btn-secondary">Сбросить</button>
                    <button id="applyFilters" class="btn btn-primary">Применить</button>
                </div>
            </aside>

            <div id="cartDrawerOverlay" class="cart-drawer-overlay"></div>
            <div id="cartDrawer" class="cart-drawer">
                <div class="cart-drawer-header">
                    <h2>Корзина</h2>
                    <button id="cartDrawerClose" class="cart-drawer-close">&times;</button>
                </div>
                <div class="cart-drawer-body">
                    <div id="cartItems"></div>
                </div>
                <div class="cart-drawer-footer">
                    <div class="cart-total">
                        <span>Итого:</span>
                        <span id="cartTotal">0 ₽</span>
                    </div>
                    <button id="checkoutBtn" class="btn btn-primary btn-block">Оформить заказ</button>
                    <div id="orderTimeMessage" class="order-time-message hidden"></div>
                </div>
            </div>

            <div id="catalog" class="catalog">
                <!-- Products will be rendered here -->
            </div>

            <div id="loadMoreContainer" class="load-more-container hidden">
                <button id="loadMoreBtn" class="btn btn-secondary">Загрузить ещё</button>
            </div>

            <div id="loading" class="loading hidden">Загрузка...</div>
            <div id="error" class="error hidden"></div>
        </div>
    </main>

    <div id="productModal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close">&times;</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="app.js?v=16"></script>

<!-- Bottom Navigation Bar (mobile) -->
<nav class="bottom-nav" id="bottomNav">
    <a href="/" class="bottom-nav-item" data-nav="catalog">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Каталог</span>
    </a>
    <a href="#" class="bottom-nav-item" id="navFilters" data-nav="filters">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path>
        </svg>
        <span>Фильтры</span>
    </a>
    <a href="#" class="bottom-nav-item" id="navCart" data-nav="cart">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span>Корзина</span>
        <span id="bottomCartCount" class="bottom-nav-badge hidden">0</span>
    </a>
    <a href="#" class="bottom-nav-item" id="navFavorites" data-nav="favorites">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span>Избранное</span>
    </a>
</nav>
</body>
</html>
